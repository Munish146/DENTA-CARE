<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DentaCare | Patient Portal Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            navy: "#111A3A",
            pink: "#E83E8C",
            purple: "#7C3AED"
          }
        }
      }
    };
  </script>
</head>

<body class="bg-white text-slate-800 dark:bg-[#0b1026] dark:text-white transition-colors duration-300">

<!-- =========================================================
     AUTH HEADER: Back to Home, RTL, Light/Dark Mode
========================================================= -->
<header class="w-full px-5 lg:px-10 py-4 flex items-center justify-between z-20 border-b border-slate-100 dark:border-slate-800 bg-white/95 dark:bg-[#111A3A]/95 backdrop-blur-md sticky top-0">
  <a href="../index.html class="inline-flex items-center gap-2 text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-[#E83E8C] transition duration-200">
    <i class="fa-solid fa-arrow-left text-xs text-[#E83E8C]"></i>
    <span>Back to Home</span>
  </a>

  <div class="flex items-center gap-3">
    <!-- RTL Toggle -->
    <button id="rtlToggle" onclick="toggleDirection()"
            class="px-3.5 py-1.5 rounded-full border border-slate-200 dark:border-slate-700
                   bg-slate-50 dark:bg-slate-800/60 hover:border-[#E83E8C]
                   text-xs font-bold text-slate-700 dark:text-slate-200
                   hover:text-[#E83E8C] transition cursor-pointer">
      <span id="rtlText">RTL</span>
    </button>

    <!-- Dark & Light Mode Toggle Button -->
    <button id="themeToggle"
            onclick="toggleTheme()"
            type="button"
            title="Toggle Dark / Light Theme"
            class="w-9 h-9 rounded-full
                   border border-slate-200 dark:border-slate-700
                   bg-slate-50 dark:bg-slate-800/60
                   hover:bg-pink-50 dark:hover:bg-white/10
                   text-slate-700 dark:text-slate-200
                   hover:text-[#E83E8C] dark:hover:text-[#E83E8C]
                   transition cursor-pointer flex items-center justify-center">
      <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
    </button>
  </div>
</header>


<!-- =========================================================
     2. INTERACTIVE PORTAL SIGN-IN CARD
========================================================= -->
<section class="py-12 lg:py-16 bg-slate-50 dark:bg-[#070B19]/60 relative">
  <div class="max-w-xl mx-auto px-4 sm:px-6">

    <!-- ALERT NOTIFICATION BOX -->
    <div id="authAlert" class="hidden w-full mb-6 p-4 rounded-2xl text-sm font-medium text-center transition shadow-lg"></div>

    <!-- MAIN SIGN IN CARD -->
    <div class="auth-card rounded-3xl p-6 sm:p-10 relative">

      <!-- AMBIENT GLOW -->
      <div class="absolute -top-12 -right-12 w-48 h-48 bg-pink/15 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-purple/15 rounded-full blur-2xl pointer-events-none"></div>

      <!-- DENTACARE LOGO & BRANDING INSIDE CARD -->
      <div class="text-center mb-7 relative z-10">
        <a href="../index.html class="inline-flex items-center justify-center gap-3 mb-3 group">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#E83E8C] to-[#7C3AED] flex items-center justify-center shadow-lg shadow-pink/30 text-white group-hover:scale-105 transition-transform duration-300">
            <i class="fa-solid fa-tooth text-2xl"></i>
          </div>
          <div class="text-left">
            <div class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight font-heading">
              Denta<span class="text-pink">Care</span>
            </div>
            <div class="text-[10px] font-bold tracking-[0.2em] text-slate-500 dark:text-slate-400 uppercase">
              PREMIUM DENTAL CLINIC
            </div>
          </div>
        </a>
        <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white font-heading">
          Sign In to Your Account
        </h2>
        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 mt-1 max-w-sm mx-auto">
          Enter your registered email or DentaCare Patient ID to proceed.
        </p>
      </div>

      <!-- FORM -->
      <form id="portalLoginForm" class="space-y-5 relative z-10">
        <!-- EMAIL / PATIENT ID -->
        <div>
          <label for="loginEmail" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
            Email Address or Patient ID
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
              <i class="fa-regular fa-envelope"></i>
            </span>
            <input type="text" id="loginEmail" required placeholder="name@example.com or DC-2026-88"
                   class="auth-input w-full pl-11 pr-4 py-3.5 rounded-xl text-sm transition focus:outline-none">
          </div>
        </div>

        <!-- PASSWORD -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="loginPassword" class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Password
            </label>
            <button type="button" onclick="handleForgotPassword()" class="text-xs font-semibold text-[#E83E8C] hover:underline cursor-pointer">
              Forgot password?
            </button>
          </div>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input type="password" id="loginPassword" required placeholder="••••••••"
                   class="auth-input w-full pl-11 pr-12 py-3.5 rounded-xl text-sm transition focus:outline-none">
            <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white text-sm cursor-pointer" title="Show/Hide Password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- REMEMBER ME CHECKBOX -->
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-400">
            <input type="checkbox" class="w-4 h-4 rounded text-pink focus:ring-pink border-slate-300 dark:border-slate-600">
            <span>Remember this device for 30 days</span>
          </label>
        </div>

        <!-- SIGN IN BUTTON -->
        <button type="submit" class="w-full py-4 px-6 rounded-full font-bold text-white text-sm tracking-wide bg-gradient-to-r from-[#E83E8C] to-[#7C3AED] hover:from-[#d63384] hover:to-[#6d28d9] shadow-lg shadow-pink/30 hover:shadow-pink/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket text-sm"></i>
          <span>Sign In to Portal</span>
        </button>
      </form>

      <!-- SOCIAL AUTH SEPARATOR -->
      <div class="relative my-6 flex items-center justify-center z-10">
        <div class="border-t border-slate-200 dark:border-slate-700 w-full"></div>
        <span class="bg-white dark:bg-[#0D1326] px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider absolute">
          OR CONTINUE WITH
        </span>
      </div>

      <!-- SOCIAL BUTTONS -->
      <div class="space-y-3 z-10 relative">
        <button type="button" onclick="mockSocialAuth('Google')"
                class="w-full py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800/60 font-semibold text-xs text-slate-700 dark:text-slate-200 flex items-center justify-center gap-3 transition cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.4s.2-1.6.4-2.4L1.6 7c-.8 1.6-1.3 3.4-1.3 5.3s.5 3.7 1.3 5.3l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 16C3.5 19.8 7.4 23 12 23z"/>
          </svg>
          <span>Continue with Google Health</span>
        </button>

        <button type="button" onclick="mockSocialAuth('Apple')"
                class="w-full py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800/60 font-semibold text-xs text-slate-700 dark:text-slate-200 flex items-center justify-center gap-3 transition cursor-pointer">
          <i class="fa-brands fa-apple text-base"></i>
          <span>Continue with Apple Health</span>
        </button>
      </div>

      <!-- CREATE ACCOUNT LINK -->
      <div class="mt-8 text-center text-xs text-slate-600 dark:text-slate-400 z-10 relative">
        <span>New to DentaCare? </span>
        <a href="register.html" class="text-pink font-bold hover:underline">
          Create a Patient Account
        </a>
      </div>

      <!-- SECURITY BADGE -->
      <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-700/60 flex items-center justify-center gap-2 text-xs text-slate-500 font-medium">
        <i class="fa-solid fa-shield-halved text-purple"></i>
        <span>256-Bit HIPAA Compliant Cloud Medical Records</span>
      </div>
    </div>

  </div>
</section>


<!-- =========================================================
     SCRIPTS & FUNCTIONALITY
========================================================= -->
<script src="../js/main.js"></script>
<script>
  function togglePasswordVisibility(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fa-regular fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fa-regular fa-eye';
    }
  }

  function showAlert(msg, isSuccess = true) {
    const alertBox = document.getElementById('authAlert');
    if (!alertBox) return;
    alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'border-emerald-300', 'bg-rose-100', 'text-rose-800', 'border-rose-300', 'dark:bg-emerald-950/80', 'dark:text-emerald-300', 'dark:border-emerald-600/50', 'dark:bg-rose-950/80', 'dark:text-rose-300', 'dark:border-rose-600/50');
    if (isSuccess) {
      alertBox.classList.add('bg-emerald-100', 'text-emerald-800', 'border', 'border-emerald-300', 'dark:bg-emerald-950/80', 'dark:text-emerald-300', 'dark:border-emerald-600/50');
    } else {
      alertBox.classList.add('bg-rose-100', 'text-rose-800', 'border', 'border-rose-300', 'dark:bg-rose-950/80', 'dark:text-rose-300', 'dark:border-rose-600/50');
    }
    alertBox.innerText = msg;
    alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function handleForgotPassword() {
    showAlert('Password reset instructions and a verification PIN have been sent to your registered email.', true);
  }

  function mockSocialAuth(provider) {
    showAlert(`Connecting securely with ${provider} Authentication...`, true);
    setTimeout(() => {
      showAlert(`Welcome to DentaCare Portal via ${provider}! Redirecting to your appointment dashboard...`, true);
      setTimeout(() => {
        window.location.href = "appointment.html";
      }, 1200);
    }, 800);
  }

  // Handle Login Submit
  document.getElementById('portalLoginForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    showAlert('Authenticating patient credentials...', true);
    setTimeout(() => {
      showAlert('Sign-in successful! Loading your 3D patient records...', true);
      setTimeout(() => {
        window.location.href = "appointment.html";
      }, 1200);
    }, 800);
  });

  function toggleFaq(button) {
    const content = button.nextElementSibling;
    const icon = button.querySelector('i');
    if (content.classList.contains('hidden')) {
      content.classList.remove('hidden');
      icon.classList.add('rotate-180');
    } else {
      content.classList.add('hidden');
      icon.classList.remove('rotate-180');
    }
  }
</script>

</body>
</html>
