<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DentaCare | Patient Registration</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            navy: "#111A3A",
            pink: "#E83E8C",
            purple: "#7C3AED"
          }
        }
      }
    };
  </script>
</head>

<body class="bg-white text-slate-800 dark:bg-[#0b1026] dark:text-white transition-colors duration-300">

<!-- =========================================================
     AUTH HEADER: Back to Home, RTL, Light/Dark Mode Only
========================================================= -->
<header class="w-full px-5 lg:px-10 py-4 flex items-center justify-between z-20 border-b border-slate-100 dark:border-slate-800 bg-white/95 dark:bg-[#111A3A]/95 backdrop-blur-md sticky top-0">
  <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-pink transition duration-200">
    <i class="fa-solid fa-arrow-left text-xs text-pink"></i>
    <span>Back to Home</span>
  </a>

  <div class="flex items-center gap-3">
    <!-- RTL Toggle -->
    <button id="rtlToggle" onclick="toggleDirection()" class="px-3.5 py-1.5 rounded-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 hover:border-pink text-xs font-bold text-slate-700 dark:text-slate-200 hover:text-pink transition flex items-center gap-1.5 cursor-pointer">
      <i class="fa-solid fa-right-left text-[10px]"></i>
      <span id="rtlText">RTL</span>
    </button>

    <!-- Theme Toggle -->
    <button id="themeToggle" onclick="toggleTheme()" class="w-9 h-9 rounded-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 hover:border-pink text-slate-700 dark:text-slate-200 hover:text-pink flex items-center justify-center text-xs transition cursor-pointer" title="Toggle Theme">
      <i id="themeIcon" class="fa-solid fa-moon"></i>
    </button>
  </div>
</header>



<!-- =========================================================
     2. INTERACTIVE REGISTRATION CARD
========================================================= -->
<section class="py-12 lg:py-16 bg-slate-50 dark:bg-[#070B19]/60 relative">
  <div class="max-w-2xl mx-auto px-4 sm:px-6">

    <!-- ALERT NOTIFICATION BOX -->
    <div id="regAlert" class="hidden w-full mb-6 p-4 rounded-2xl text-sm font-medium text-center transition shadow-lg"></div>

    <!-- MAIN REGISTRATION CARD -->
    <div class="auth-card rounded-3xl p-6 sm:p-10 relative">

      <!-- AMBIENT GLOW -->
      <div class="absolute -top-12 -right-12 w-48 h-48 bg-pink/15 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -left-12 w-48 h-48 bg-purple/15 rounded-full blur-2xl pointer-events-none"></div>

      <!-- DENTACARE LOGO & BRANDING INSIDE CARD -->
      <div class="text-center mb-7 relative z-10">
        <a href="index.html" class="inline-flex items-center justify-center gap-3 mb-3 group">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#E83E8C] to-[#7C3AED] flex items-center justify-center shadow-lg shadow-pink/30 text-white group-hover:scale-105 transition-transform duration-300">
            <i class="fa-solid fa-tooth text-2xl"></i>
          </div>
          <div class="text-left">
            <div class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight font-heading">
              Denta<span class="text-pink">Care</span>
            </div>
            <div class="text-[10px] font-bold tracking-[0.2em] text-slate-500 dark:text-slate-400 uppercase">
              PREMIUM DENTAL CLINIC
            </div>
          </div>
        </a>
        <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white font-heading">
          Create Your Patient Account
        </h2>
        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 mt-1 max-w-sm mx-auto">
          Fill in your basic details to set up your encrypted clinical profile.
        </p>
      </div>

      <!-- FORM -->
      <form id="fullRegistrationForm" class="space-y-4 relative z-10">

        <!-- NAME ROW -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="pFirstName" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              First Name *
            </label>
            <input type="text" id="pFirstName" required placeholder="e.g. Priya"
                   class="auth-input w-full px-4 py-3 rounded-xl text-sm transition focus:outline-none">
          </div>
          <div>
            <label for="pLastName" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Last Name *
            </label>
            <input type="text" id="pLastName" required placeholder="e.g. Sharma"
                   class="auth-input w-full px-4 py-3 rounded-xl text-sm transition focus:outline-none">
          </div>
        </div>

        <!-- CONTACT ROW -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="pEmail" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Email Address *
            </label>
            <input type="email" id="pEmail" required placeholder="priya@example.com"
                   class="auth-input w-full px-4 py-3 rounded-xl text-sm transition focus:outline-none">
          </div>
          <div>
            <label for="pPhone" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Phone Number *
            </label>
            <input type="tel" id="pPhone" required placeholder="+91 98765 43210"
                   class="auth-input w-full px-4 py-3 rounded-xl text-sm transition focus:outline-none">
          </div>
        </div>

        <!-- DOB & GENDER ROW -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="pDOB" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Date of Birth
            </label>
            <input type="date" id="pDOB"
                   class="auth-input w-full px-4 py-3 rounded-xl text-sm transition focus:outline-none">
          </div>
          <div>
            <label for="pGender" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Gender
            </label>
            <select id="pGender" class="auth-input w-full px-4 py-3 rounded-xl text-sm transition focus:outline-none">
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Non-Binary / Other</option>
              <option value="prefer_not">Prefer not to say</option>
            </select>
          </div>
        </div>

        <!-- PRIMARY CONCERN -->
        <div>
          <label for="pConcern" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
            Primary Dental Need or Specialty
          </label>
          <select id="pConcern" class="auth-input w-full px-4 py-3 rounded-xl text-sm transition focus:outline-none">
            <option value="cleaning">Routine Dental Cleaning & Comprehensive Checkup</option>
            <option value="whitening">Cosmetic Teeth Whitening & Veneers</option>
            <option value="braces">Orthodontics & Clear Aligners</option>
            <option value="implants">Dental Implants & 3D Restorations</option>
            <option value="rootcanal">Painless Root Canal Treatment</option>
            <option value="emergency">Immediate Emergency Pain Relief</option>
          </select>
        </div>

        <!-- PASSWORD ROW -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="pPassword" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Create Password *
            </label>
            <div class="relative">
              <input type="password" id="pPassword" required placeholder="••••••••"
                     class="auth-input w-full px-4 py-3 pr-10 rounded-xl text-sm transition focus:outline-none">
              <button type="button" onclick="togglePassVisibility('pPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white text-xs cursor-pointer">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
          <div>
            <label for="pConfirmPassword" class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Confirm Password *
            </label>
            <div class="relative">
              <input type="password" id="pConfirmPassword" required placeholder="••••••••"
                     class="auth-input w-full px-4 py-3 pr-10 rounded-xl text-sm transition focus:outline-none">
              <button type="button" onclick="togglePassVisibility('pConfirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white text-xs cursor-pointer">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- TERMS CHECKBOX -->
        <div class="flex items-start gap-2 pt-2">
          <input type="checkbox" id="pTerms" required class="mt-1 w-4 h-4 rounded text-pink focus:ring-pink border-slate-300 dark:border-slate-600">
          <label for="pTerms" class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
            I agree to DentaCare's <a href="contact.html" class="text-pink font-semibold hover:underline">Terms of Service</a> and confirm adherence to the <a href="contact.html" class="text-pink font-semibold hover:underline">HIPAA Healthcare Privacy Standard</a>.
          </label>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit"
                class="w-full py-4 px-6 rounded-full font-bold text-white text-sm tracking-wide bg-gradient-to-r from-[#E83E8C] to-[#7C3AED] hover:from-[#d63384] hover:to-[#6d28d9] shadow-lg shadow-pink/30 hover:shadow-pink/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer flex items-center justify-center gap-2 mt-4">
          <i class="fa-solid fa-user-check text-sm"></i>
          <span>Complete Registration & Access Portal</span>
        </button>
      </form>

      <!-- SWITCH TO LOGIN LINK -->
      <div class="mt-6 text-center text-xs text-slate-600 dark:text-slate-400 z-10 relative">
        <span>Already have an account? </span>
        <a href="login.html" class="text-pink font-bold hover:underline">
          Sign In to Portal
        </a>
      </div>

      <!-- SECURITY BADGE -->
      <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-700/60 flex items-center justify-center gap-2 text-xs text-slate-500 font-medium">
        <i class="fa-solid fa-shield-halved text-purple"></i>
        <span>256-Bit HIPAA Encrypted Health Record Profile</span>
      </div>
    </div>

  </div>
</section>

<!-- =========================================================
     SCRIPTS & FUNCTIONALITY
========================================================= -->
<script src="../js/main.js"></script>
<script>
  function togglePassVisibility(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fa-regular fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fa-regular fa-eye';
    }
  }

  function showRegAlert(msg, isSuccess = true) {
    const alertBox = document.getElementById('regAlert');
    if (!alertBox) return;
    alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'border-emerald-300', 'bg-rose-100', 'text-rose-800', 'border-rose-300', 'dark:bg-emerald-950/80', 'dark:text-emerald-300', 'dark:border-emerald-600/50', 'dark:bg-rose-950/80', 'dark:text-rose-300', 'dark:border-rose-600/50');
    if (isSuccess) {
      alertBox.classList.add('bg-emerald-100', 'text-emerald-800', 'border', 'border-emerald-300', 'dark:bg-emerald-950/80', 'dark:text-emerald-300', 'dark:border-emerald-600/50');
    } else {
      alertBox.classList.add('bg-rose-100', 'text-rose-800', 'border', 'border-rose-300', 'dark:bg-rose-950/80', 'dark:text-rose-300', 'dark:border-rose-600/50');
    }
    alertBox.innerText = msg;
    alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // Handle Registration Submit
  document.getElementById('fullRegistrationForm')?.addEventListener('submit', function(e) {
    e.preventDefault();
    const p1 = document.getElementById('pPassword').value;
    const p2 = document.getElementById('pConfirmPassword').value;
    if (p1 !== p2) {
      showRegAlert('Passwords do not match! Please verify your password entry.', false);
      return;
    }
    const fname = document.getElementById('pFirstName').value;
    showRegAlert(`Creating encrypted patient profile for ${fname}...`, true);
    setTimeout(() => {
      showRegAlert('Account created successfully! Welcome to DentaCare. Redirecting to your dashboard...', true);
      setTimeout(() => {
        window.location.href = "appointment.html";
      }, 1200);
    }, 900);
  });

  function toggleFaq(button) {
    const content = button.nextElementSibling;
    const icon = button.querySelector('i');
    if (content.classList.contains('hidden')) {
      content.classList.remove('hidden');
      icon.classList.add('rotate-180');
    } else {
      content.classList.add('hidden');
      icon.classList.remove('rotate-180');
    }
  }
</script>

</body>
</html>
